<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e6fd9">
    <title>Đăng nhập Dược sĩ - CareConnect Pharmacy Portal</title>
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .portal-auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #f5f8fc 0%, #e8f1fd 100%);
        }
        .portal-auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
        }
        @media (max-width: 480px) {
            .portal-auth-page {
                padding: 16px;
            }
            .portal-auth-card {
                padding: 24px 18px;
                border-radius: 14px;
            }
        }
        .portal-auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .portal-auth-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #1e6fd9, #1557b0);
            color: #ffffff;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(30, 111, 217, 0.3);
        }
        .demo-chip-box {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border);
        }
        .demo-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .demo-btn:hover {
            border-color: var(--primary);
            background: var(--primary-softer);
        }
        .demo-btn strong {
            display: block;
            color: var(--primary-dark);
            font-size: 0.88rem;
        }
        .demo-btn span {
            font-size: 0.78rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main class="portal-auth-page">
        <div class="portal-auth-card">
            <div class="portal-auth-header">
                <div class="portal-auth-icon">💊</div>
                <h1 style="font-size:1.4rem;font-weight:700;color:var(--text)">Pharmacy Portal</h1>
                <p class="muted small" style="margin-top:4px">Cổng Quản lý Nhà thuốc & Báo giá Đơn thuốc chuẩn GPP</p>
            </div>

            <form id="login-form" class="stack" novalidate>
                <div class="field">
                    <label for="phone">Số điện thoại Dược sĩ</label>
                    <input class="input" id="phone" name="phone" type="tel" placeholder="0900000021" required>
                </div>
                <div class="field">
                    <label for="password">Mật khẩu</label>
                    <input class="input" id="password" name="password" type="password" placeholder="••••••" required>
                </div>
                <button class="btn btn-primary btn-lg btn-block" type="submit" id="btn-submit" style="margin-top:8px">
                    Đăng nhập ca trực
                </button>
            </form>

            <div class="demo-chip-box">
                <p class="small muted center" style="margin-bottom:12px;font-weight:600">Đăng nhập nhanh tài khoản demo (1 click):</p>
                <button class="demo-btn" data-phone="0900000021" data-pass="123456">
                    <strong>DS. Đỗ Minh Tâm — Nhà thuốc Minh Tâm (Hà Nội)</strong>
                    <span>Đối tác PRO • SĐT: 0900000021</span>
                </button>
                <button class="demo-btn" data-phone="0900000022" data-pass="123456">
                    <strong>DS. Vũ Thị Phúc — Nhà thuốc Phúc An (Nam Định)</strong>
                    <span>Nhà thuốc đạt chuẩn GPP • SĐT: 0900000022</span>
                </button>
            </div>
        </div>
    </main>

    <script src="../shared/js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
